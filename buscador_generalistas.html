<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Líder GTA</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #00aeef 0%, #60bb46 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo img {
            max-width: 300px;
            height: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
        }
        
        .search-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .search-input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border 0.3s;
        }
        
        .search-input:focus {
            border-color: #00aeef;
        }
        
        .result-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
        }
        
        .result-card.show {
            display: block;
        }

        /* === Cabecera: foto + nombre + unidad === */
        .generalista-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding-bottom: 18px;
            border-bottom: 1px solid #eee;
        }
        
        .generalista-photo {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00aeef;
            flex-shrink: 0;
        }
        
        .generalista-nombre {
            color: #333;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .generalista-unidad {
            color: #888;
            font-size: 13px;
        }

        /* === Sección de contacto del líder === */
        .seccion-titulo {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 18px;
            margin-bottom: 10px;
        }

        .datos-tabla {
            width: 100%;
            border-collapse: collapse;
        }

        .datos-tabla td {
            padding: 7px 0;
            font-size: 14px;
            vertical-align: middle;
        }

        .datos-tabla .label {
            color: #888;
            width: 90px;
        }

        .datos-tabla .valor {
            text-align: right;
        }

        .datos-tabla a {
            color: #00aeef;
            text-decoration: none;
        }

        .datos-tabla a:hover {
            text-decoration: underline;
        }

        /* WhatsApp */
        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background-color: #25D366;
            color: white;
            padding: 5px 12px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            transition: background-color 0.3s;
            margin-left: 8px;
        }
        
        .whatsapp-btn:hover {
            background-color: #128C7E;
            text-decoration: none;
            color: white;
        }

        /* === Distrital === */
        .distrital-box {
            background: #f5f7fa;
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .distrital-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .distrital-nombre {
            font-size: 14px;
            color: #333;
            font-weight: bold;
            margin-top: 2px;
        }

        /* === Separador === */
        .separador {
            border: none;
            border-top: 1px solid #eee;
            margin: 18px 0 14px;
        }

        /* === Escalamiento al jefe === */
        .escalar-box {
            background: #fafafa;
            border-radius: 8px;
            padding: 14px 16px;
            text-align: center;
        }

        .escalar-msg {
            font-size: 13px;
            color: #999;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .escalar-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #00aeef;
            font-size: 13px;
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
            transition: color 0.2s;
        }

        .escalar-link:hover {
            color: #008bbf;
            text-decoration: underline;
        }

        .escalar-arrow {
            font-size: 10px;
        }

        /* === Info del jefe (oculta) === */
        .jefe-box {
            background: #fafafa;
            border-radius: 8px;
            padding: 14px 16px;
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        .jefe-box.show {
            display: block;
        }

        .jefe-titulo {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .jefe-tabla {
            width: 100%;
            border-collapse: collapse;
        }

        .jefe-tabla td {
            padding: 5px 0;
            font-size: 14px;
        }

        .jefe-tabla .label {
            color: #888;
            width: 80px;
        }

        .jefe-tabla .valor {
            text-align: right;
            color: #333;
            user-select: all;
            -webkit-user-select: all;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: white;
            display: none;
        }
        
        .no-results.show {
            display: block;
        }

        /* === Responsivo móvil === */
        @media (max-width: 600px) {
            body { padding: 12px; }

            .search-box, .result-card { padding: 20px; }

            h1 { font-size: 18px; }

            .generalista-header {
                flex-direction: column;
                text-align: center;
            }

            .generalista-photo {
                width: 72px;
                height: 72px;
            }

            .datos-tabla .label { width: 75px; }
            .datos-tabla td { font-size: 13px; }

            .whatsapp-btn {
                margin-left: 0;
                margin-top: 4px;
            }

            .valor-contacto {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                gap: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="logo.png" alt="Logo">
        </div>
        
        <div class="search-box">
            <h1>Buscador de Líder de Gestión del Talento</h1>
            <input type="text" class="search-input" id="searchInput" placeholder="Escribe el nombre de tu unidad de negocio...">
        </div>
        
        <div class="result-card" id="resultCard">

            <!-- Cabecera: foto + nombre + unidad -->
            <div class="generalista-header">
                <img src="" alt="Foto" class="generalista-photo" id="generalistaPhoto">
                <div>
                    <div class="generalista-nombre" id="generalistaName"></div>
                    <div class="generalista-unidad">Unidad: <span id="unidadName"></span></div>
                </div>
            </div>

            <!-- Contacto del líder -->
            <div class="seccion-titulo">Contacto del líder de gestión</div>
            <table class="datos-tabla">
                <tr>
                    <td class="label">Teléfono</td>
                    <td class="valor">
                        <span class="valor-contacto">
                            <a href="" id="generalistaPhone"></a>
                            <a href="" id="generalistaWhatsapp" class="whatsapp-btn" target="_blank">📱 WhatsApp</a>
                        </span>
                    </td>
                </tr>
                <tr>
                    <td class="label">Correo</td>
                    <td class="valor"><a href="" id="generalistaEmail"></a></td>
                </tr>
            </table>

            <!-- Distrital -->
            <div class="distrital-box">
                <div class="distrital-label">Distrital</div>
                <div class="distrital-nombre" id="distritalName"></div>
            </div>

            <!-- Separador -->
            <hr class="separador">

            <!-- Escalamiento al jefe -->
            <div class="escalar-box" id="escalarBox">
                <div class="escalar-msg">Si el líder de gestión no te contestó,<br>puedes contactar a su jefe:</div>
                <button class="escalar-link" onclick="mostrarJefe()">
                    Mostrar contacto del jefe <span class="escalar-arrow">▼</span>
                </button>
            </div>

            <!-- Info del jefe (oculta) -->
            <div class="jefe-box" id="jefeBox">
                <div class="jefe-titulo">Jefe del líder de gestión</div>
                <table class="jefe-tabla">
                    <tr>
                        <td class="label">Nombre</td>
                        <td class="valor" id="jefeName"></td>
                    </tr>
                    <tr>
                        <td class="label">Teléfono</td>
                        <td class="valor" id="jefePhone"></td>
                    </tr>
                </table>
            </div>

        </div>
        
        <div class="no-results" id="noResults">
            <p>No se encontraron resultados. Intenta con otra palabra clave.</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
        let data = [];
        const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSRW07qk9d2snG3CqCaeRXlOvSPmQ0NWDG4fltNT8Axb8TboWCEqUNO496w7w-Z85mw4vHK1cku8cys/pub?output=csv&gid=0';
        
        fetch(sheetURL)
            .then(response => response.text())
            .then(csv => {
                Papa.parse(csv, {
                    header: true,
                    complete: function(results) {
                        data = results.data;
                    }
                });
            });
        
        const searchInput = document.getElementById('searchInput');
        const resultCard = document.getElementById('resultCard');
        const noResults = document.getElementById('noResults');
        
        searchInput.addEventListener('input', function() {
            const searchTerm = this.value.toLowerCase().trim();
            
            if (searchTerm === '') {
                resultCard.classList.remove('show');
                noResults.classList.remove('show');
                return;
            }
            
            const result = data.find(row => 
                row.Unidad && row.Unidad.toLowerCase().includes(searchTerm)
            );
            
            if (result) {
                showResult(result);
            } else {
                resultCard.classList.remove('show');
                noResults.classList.add('show');
            }
        });
        
        function showResult(row) {
            const generalistaName = row.Generalista || '';
            
            const photoMap = {
                'Andrea Mendoza': 'Andrea_Mendoza.png',
                'Carlos Reyes': 'Carlos_Reyes.png',
                'Dinora López': 'Dinora_Lopez.png',
                'Ana Gabriela Bran': 'Gabriela_Bran.png',
                'Irma Leonardo': 'Irma_Leonardo.png',
                'Irma Morales': 'Irma_Morales.png',
                'Vanessa Wannam': 'Vanessa_Wannam.png',
                'Luis Najarro': 'Luis_Najarro.png',
                'Marvin Alvarado': 'Marvin_Alvarado.png',
                'Neemias Estrada': 'Neemias_Estrada.png',
                'Raul Cobon': 'Raul_Rodriguez.png',
                'Rony Calel': 'Rony_Calel.png'
            };
            
            document.getElementById('generalistaPhoto').src = photoMap[generalistaName] || 'logo.png';
            document.getElementById('generalistaName').textContent = generalistaName;
            document.getElementById('unidadName').textContent = row.Unidad || '';
            
            const phone = row.Telefono_Generalista || '';
            document.getElementById('generalistaPhone').textContent = phone;
            document.getElementById('generalistaPhone').href = 'tel:+502' + phone;
            
            const whatsappURL = 'https://wa.me/502' + phone + '?text=Hola,%20necesito%20información';
            document.getElementById('generalistaWhatsapp').href = whatsappURL;
            
            const email = row.Correo_Generalista || '';
            document.getElementById('generalistaEmail').textContent = email;
            document.getElementById('generalistaEmail').href = 'mailto:' + email;
            
            document.getElementById('distritalName').textContent = row.Distrito || '';
            document.getElementById('jefeName').textContent = row.Jefe || '';
            
            const jefePhone = row.Telefono_Jefe || '';
            document.getElementById('jefePhone').textContent = jefePhone;
            
            document.getElementById('jefeBox').classList.remove('show');
            document.getElementById('escalarBox').style.display = 'block';
            
            resultCard.classList.add('show');
            noResults.classList.remove('show');
        }

        function mostrarJefe() {
            document.getElementById('escalarBox').style.display = 'none';
            document.getElementById('jefeBox').classList.add('show');
        }
    </script>
</body>
</html>
